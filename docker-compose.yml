version: "3.8"

# 智驾游本地基础设施
# 启动: docker compose up -d
# 停止: docker compose down
# 清理数据: docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: zhijiaoyou-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-hitch}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - zhijiaoyou-mysql:/var/lib/mysql
      - ./hitch.sql:/docker-entrypoint-initdb.d/01-hitch.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zhijiaoyou-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zhijiaoyou-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: zhijiaoyou-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-notice}
    ports:
      - "27017:27017"
    volumes:
      - zhijiaoyou-mongo:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: zhijiaoyou-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - zhijiaoyou-rabbitmq:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: zhijiaoyou-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9005:9000"
      - "9006:9001"
    volumes:
      - zhijiaoyou-minio:/data

volumes:
  zhijiaoyou-mysql:
  zhijiaoyou-redis:
  zhijiaoyou-mongo:
  zhijiaoyou-rabbitmq:
  zhijiaoyou-minio: